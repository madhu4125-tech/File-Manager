name: Build File Manager APK (Kotlin)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        shell: bash
        run: gradle assembleDebug --no-daemon --console=plain 2>&1 | tee build.log

      # Runs only when the build fails: prints just the real errors in one short block.
      - name: Show compile errors
        if: failure()
        shell: bash
        run: |
          echo "=========== KOTLIN / RESOURCE ERRORS (copy everything below) ==========="
          grep -E "^e: |^e:|error:|AAPT|Unresolved|What went wrong" -A3 build.log | head -150 || true
          echo "=========== END ==========="

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: file-manager-kotlin-apk
          path: app/build/outputs/apk/debug/app-debug.apk
